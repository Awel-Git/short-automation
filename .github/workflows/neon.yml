name: Publish Finished NeonClipping Clip

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Finished MP4 asset ID from a NeonClipping draft release
        required: true
        type: string
      title:
        description: YouTube title
        type: string
      dry_run:
        description: Check the file without uploading to YouTube
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download finished clip
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/finished.mp4"
          test -s "$RUNNER_TEMP/finished.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
            -of csv=p=0 "$RUNNER_TEMP/finished.mp4" | grep -qx h264
      - uses: actions/setup-python@v5
        if: ${{ !inputs.dry_run }}
        with:
          python-version: '3.11'
      - name: Install YouTube uploader dependencies
        if: ${{ !inputs.dry_run }}
        run: python -m pip install google-api-python-client google-auth-httplib2
      - name: Upload finished clip to YouTube
        if: ${{ !inputs.dry_run }}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          SHORTS_INPUT_FILE: ${{ runner.temp }}/finished.mp4
          SHORTS_TITLE: ${{ inputs.title }}
        run: python scripts/publish_neon_shorts.py
