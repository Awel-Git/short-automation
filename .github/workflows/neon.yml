
name: NeonClipping Cloud Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NeonClipping tests
        env:
          NEONCLIPPING_CPU: "1"
          NEONCLIPPING_ENCODER: x264
        run: |
          python -m unittest discover -s tests -v

          
      - name: Install YouTube dependencies
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Publish Shorts to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          SHORTS_OUTPUT_DIR: output
        run: python upload_shorts.py

